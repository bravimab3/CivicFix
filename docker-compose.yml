services:

  db:
    image: postgres:16
    container_name: civicfix-db
    environment:
      POSTGRES_USER: civicfix
      POSTGRES_PASSWORD: civicfix
      POSTGRES_DB: civicfix
    ports:
      - "5434:5432"
    volumes:
      - civicfix_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: civicfix-backend
    ports:
      - "8010:8000"
    volumes:
      - ./backend:/app
    depends_on:
      - db

volumes:
  civicfix_data: